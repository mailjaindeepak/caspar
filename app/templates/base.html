<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Caspar Leads{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <a class="brand" href="{{ url_for('dashboard') }}">Caspar <span>Leads</span></a>
  <nav>
    {% if user %}
      {% if user['role'] == 'admin' %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
      <span class="who">{{ user['name'] }}</span>
      <a href="{{ url_for('logout') }}">Log out</a>
    {% endif %}
  </nav>
</header>
<main>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
